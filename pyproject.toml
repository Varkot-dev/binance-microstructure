[project]
name = "microstructure"
version = "0.1.0"
description = "Empirical market microstructure on Binance tick data: order-flow memory, impact kernels, Hawkes endogeneity, and execution replay across a 121-symbol cross-section."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.urls]
Homepage = "https://github.com/Varkot-dev/binance-microstructure"
Results = "https://varkot-dev.github.io/binance-microstructure/"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microstructure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: touches the internet (deselect with '-m \"not network\"')"]

[tool.ruff]
line-length = 100
