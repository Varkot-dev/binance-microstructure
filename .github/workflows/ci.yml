name: ci

# Runs on every push to any branch (so work branches are checked before a pull request
# exists) and on pull requests from forks. A pull request from a branch of this repository
# is already covered by the push run, so its pull_request run is skipped and does not take
# a runner slot. Data-only branches (p1-scan-checkpoint) carry no code and are ignored.
on:
  push:
    branches: ["**", "!p1-scan-checkpoint"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest -m "not network" -q
